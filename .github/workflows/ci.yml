name: Validate

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check syntax
        run: |
          node --check app.js
          node --check core.js
          node --check db.js
          node --check server.mjs
          node --check sw.js

      - name: Run tests
        run: |
          node tests/core.test.js
          node tests/structure.test.js
